<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReplayMod Analytics</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0f1e;--surface:#111827;--border:#1f2937;--text:#f0f4f8;--muted:#6b7280;--gold:#e8a020;--green:#10b981;--red:#ef4444;--blue:#3b82f6;--purple:#8b5cf6;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;font-size:14px;}
#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;}
#app{display:none;}
.shell{display:flex;min-height:100vh;}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);padding:24px 0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
.main{flex:1;padding:28px;overflow-x:hidden;}
.logo{padding:0 20px 24px;border-bottom:1px solid var(--border);margin-bottom:16px;}
.logo-title{font-size:18px;font-weight:700;color:var(--gold);}
.logo-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.nav-section{padding:8px 20px 4px;font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;color:var(--muted);transition:all .15s;font-size:13px;border-left:3px solid transparent;}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.04);}
.nav-item.active{color:var(--gold);background:rgba(232,160,32,.08);border-left-color:var(--gold);}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.page-title{font-size:22px;font-weight:700;}
.controls{display:flex;gap:10px;}
select,button{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:7px 14px;border-radius:6px;font-size:13px;cursor:pointer;}
.refresh-btn{background:var(--gold);color:#000;font-weight:600;border:none;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-bottom:28px;}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:18px;}
.kpi-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.kpi-value{font-size:28px;font-weight:700;line-height:1;}
.kpi-sub{font-size:11px;color:var(--muted);margin-top:6px;}
.kpi.good .kpi-value{color:var(--green);}
.kpi.warn .kpi-value{color:var(--gold);}
.kpi.bad .kpi-value{color:var(--red);}
.chart-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
.chart-grid.wide{grid-template-columns:1fr;}
.chart-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px;}
.chart-title{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px;}
.chart-wrap{position:relative;height:220px;}
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.table-header{padding:14px 20px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;}
table{width:100%;border-collapse:collapse;}
th{padding:10px 16px;text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;border-bottom:1px solid var(--border);}
td{padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px;}
tr:last-child td{border-bottom:none;}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.pill.gold{background:rgba(232,160,32,.15);color:var(--gold);}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:40px;width:360px;text-align:center;}
.login-title{font-size:22px;font-weight:700;color:var(--gold);margin-bottom:6px;}
.login-sub{color:var(--muted);font-size:13px;margin-bottom:28px;}
.login-box input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;font-size:14px;margin-bottom:12px;outline:none;}
.login-box input:focus{border-color:var(--gold);}
.login-box button{width:100%;padding:10px;background:var(--gold);color:#000;font-weight:700;border:none;border-radius:6px;font-size:15px;cursor:pointer;}
.status-bar{text-align:right;font-size:11px;color:var(--muted);margin-bottom:16px;}
@media(max-width:768px){.chart-grid{grid-template-columns:1fr;}.sidebar{display:none;}.kpi-grid{grid-template-columns:1fr 1fr;}}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-box">
    <div class="login-title">ReplayMod</div>
    <div class="login-sub">Analytics Dashboard</div>
    <input type="password" id="admin-key" placeholder="Admin key"/>
    <button onclick="login()">Enter</button>
    <div id="login-err" style="color:var(--red);font-size:12px;margin-top:10px;"></div>
  </div>
</div>
<div id="app">
  <div class="shell">
    <nav class="sidebar">
      <div class="logo"><div class="logo-title">ReplayMod</div><div class="logo-sub">Analytics</div></div>
      <div class="nav-section">Overview</div>
      <div class="nav-item active" data-view="overview">📊 Overview</div>
      <div class="nav-item" data-view="retention">🔄 Retention</div>
      <div class="nav-item" data-view="errors">🚨 Errors</div>
      <div class="nav-section">Games</div>
      <div class="nav-item" data-view="gameplay" data-product="basketball">🏀 Basketball</div>
      <div class="nav-item" data-view="gameplay" data-product="worldcup">⚽ World Cup</div>
      <div class="nav-item" data-view="gameplay" data-product="nfl">🏈 NFL</div>
      <div class="nav-section">Features</div>
      <div class="nav-item" data-view="social">💬 Social / PvP</div>
      <div class="nav-item" data-view="social" data-product="news">📰 News</div>
      <div class="nav-item" data-view="raw">🗃
    </nav>
    <main class="main">
      <div class="page-header">
        <div class="page-title" id="page-title">Overview</div>
        <div class="controls">
          <select id="days-select" onchange="reload()">
            <option value="1">Today</option>
            <option value="7" selected>Last 7 days</option>
            <option value="14">Last 14 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
          </select>
          <button class="refresh-btn" onclick="reload()">↻ Refresh</button>
        </div>
      </div>
      <div class="status-bar" id="status-bar"></div>
      <div id="content"></div>
    </main>
  </div>
</div><script>
const S={key:'',view:'overview',product:'basketball',days:7};
const CH={};

async function login(){
  const k=document.getElementById('admin-key').value.trim();
  if(!k)return;
  const r=await fetch('/api/analytics-read?key='+k+'&view=overview&days=1');
  if(r.ok){S.key=k;document.getElementById('login-screen').style.display='none';document.getElementById('app').style.display='block';reload();}
  else document.getElementById('login-err').textContent='Invalid key.';
}
document.getElementById('admin-key').addEventListener('keydown',e=>{if(e.key==='Enter')login();});

document.querySelectorAll('.nav-item').forEach(el=>{
  el.addEventListener('click',function(){
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    this.classList.add('active');
    S.view=this.dataset.view;
    if(this.dataset.product)S.product=this.dataset.product;
    reload();
  });
});

function reload(){S.days=parseInt(document.getElementById('days-select').value);load();}

async function api(view){
  const r=await fetch('/api/analytics-read?key='+S.key+'&view='+view+'&days='+S.days+'&product='+S.product);
  if(!r.ok)throw new Error('API error '+r.status);
  return r.json();
}

const OPTS={responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{grid:{color:'#1f2937'},ticks:{color:'#6b7280',font:{size:10}}},y:{grid:{color:'#1f2937'},ticks:{color:'#6b7280',font:{size:10}},beginAtZero:true}}};
function mkChart(id,type,labels,datasets,extra={}){
  if(CH[id])CH[id].destroy();
  const ctx=document.getElementById(id)?.getContext('2d');
  if(!ctx)return;
  CH[id]=new Chart(ctx,{type,data:{labels,datasets},options:{...OPTS,...extra}});
}
const ln=(data,color,label='')=>({label,data,borderColor:color,backgroundColor:color+'22',fill:true,tension:.3,pointRadius:3});
const br=(data,color,label='')=>({label,data,backgroundColor:color+'bb',borderColor:color,borderWidth:1,borderRadius:4});
const kpi=(label,value,sub='',cls='')=>'<div class="kpi '+cls+'"><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div>'+(sub?'<div class="kpi-sub">'+sub+'</div>':'')+'</div>';

async function renderOverview(d){
  const s=d.summary,bc=s.bustRate>60?'bad':s.bustRate<40?'warn':'good',rc=s.retentionRate>40?'good':s.retentionRate>20?'warn':'bad';
  document.getElementById('content').innerHTML=
    '<div class="kpi-grid">'+kpi('Total Events',s.totalEvents.toLocaleString())+kpi('Hands Played',s.totalHands.toLocaleString())+kpi('Bust Rate',s.bustRate+'%','target 45-55%',bc)+kpi('New Users',s.newUsers.toLocaleString())+kpi('Returning',s.returningUsers.toLocaleString())+kpi('Retention',s.retentionRate+'%','returning/total',rc)+'</div>'+
    '<div class="chart-grid"><div class="chart-card"><div class="chart-title">Daily Active Users</div><div class="chart-wrap"><canvas id="c-dau"></canvas></div></div><div class="chart-card"><div class="chart-title">Hands Per Day</div><div class="chart-wrap"><canvas id="c-hands"></canvas></div></div></div>';
  mkChart('c-dau','line',d.dauByDay.map(x=>x.date.slice(5)),[ln(d.dauByDay.map(x=>x.dau),'#3b82f6')]);
  mkChart('c-hands','bar',d.handsByDay.map(x=>x.date.slice(5)),[br(d.handsByDay.map(x=>x.hands),'#e8a020')]);
}

async function renderGameplay(d){
  const t=d.totals,bust=t.resolved>0?((t.busts/t.resolved)*100).toFixed(1):0,sc=t.resolved>0?((t.soClose/t.resolved)*100).toFixed(1):0,bc=bust>60?'bad':bust<40?'warn':'good';
  document.getElementById('content').innerHTML=
    '<div class="kpi-grid">'+kpi('Dealt',t.dealt.toLocaleString())+kpi('Resolved',t.resolved.toLocaleString())+kpi('Bust Rate',bust+'%','target 45-55%',bc)+kpi('Win Rate',(100-Number(bust)).toFixed(1)+'%')+kpi('So Close',sc+'%','within 5 FP')+'</div>'+
    '<div class="chart-grid"><div class="chart-card"><div class="chart-title">Hands Per Day</div><div class="chart-wrap"><canvas id="c-dealt"></canvas></div></div><div class="chart-card"><div class="chart-title">Bust Rate %</div><div class="chart-wrap"><canvas id="c-bust"></canvas></div></div><div class="chart-card"><div class="chart-title">Avg Score</div><div class="chart-wrap"><canvas id="c-score"></canvas></div></div><div class="chart-card"><div class="chart-title">Avg Hands / Session</div><div class="chart-wrap"><canvas id="c-sess"></canvas></div></div></div>'+
    '<div class="table-card"><div class="table-header">Tier Hits by Day</div><table><thead><tr><th>Date</th><th>MVP</th><th>All Star</th><th>Starter</th><th>Rookie</th><th>Busts</th><th>Total</th></tr></thead><tbody>'+
    d.dailyStats.map(x=>'<tr><td>'+x.date+'</td><td>'+(x.tierHits?.MVP||0)+'</td><td>'+(x.tierHits?.ALL_STAR||0)+'</td><td>'+(x.tierHits?.STARTER||0)+'</td><td>'+(x.tierHits?.ROOKIE||0)+'</td><td>'+x.busts+'</td><td>'+x.resolved+'</td></tr>').join('')+
    '</tbody></table></div>';
  const lbl=d.dailyStats.map(x=>x.date.slice(5));
  mkChart('c-dealt','bar',lbl,[br(d.dailyStats.map(x=>x.dealt),'#e8a020')]);
  mkChart('c-bust','line',lbl,[ln(d.dailyStats.map(x=>x.bustRate),'#ef4444')]);
  mkChart('c-score','line',lbl,[ln(d.dailyStats.map(x=>x.avgScore),'#10b981')]);
  mkChart('c-sess','bar',d.sessionStats.map(x=>x.date.slice(5)),[br(d.sessionStats.map(x=>x.avgHandsPerSession),'#8b5cf6')]);
}

async function renderRetention(d){
  document.getElementById('content').innerHTML=
    '<div class="chart-grid wide"><div class="chart-card"><div class="chart-title">New vs Returning</div><div class="chart-wrap"><canvas id="c-ret"></canvas></div></div></div>'+
    '<div class="chart-grid"><div class="chart-card"><div class="chart-title">Daily Active Users</div><div class="chart-wrap"><canvas id="c-dau2"></canvas></div></div><div class="chart-card"><div class="chart-title">New Users Per Day</div><div class="chart-wrap"><canvas id="c-new"></canvas></div></div></div>';
  const lbl=d.cohortData.map(x=>x.date.slice(5));
  mkChart('c-ret','bar',lbl,[br(d.cohortData.map(x=>x.newUsers),'#3b82f6','New'),br(d.cohortData.map(x=>x.returningUsers),'#10b981','Returning')],{plugins:{legend:{display:true,labels:{color:'#6b7280'}}}});
  mkChart('c-dau2','line',lbl,[ln(d.cohortData.map(x=>x.dau),'#e8a020')]);
  mkChart('c-new','bar',lbl,[br(d.cohortData.map(x=>x.newUsers),'#3b82f6')]);
}

async function renderSocial(d){
  document.getElementById('content').innerHTML=
    '<div class="chart-grid"><div class="chart-card"><div class="chart-title">Comments</div><div class="chart-wrap"><canvas id="c-cmt"></canvas></div></div><div class="chart-card"><div class="chart-title">PvP Challenges</div><div class="chart-wrap"><canvas id="c-pvp"></canvas></div></div><div class="chart-card"><div class="chart-title">News Views</div><div class="chart-wrap"><canvas id="c-news"></canvas></div></div><div class="chart-card"><div class="chart-title">News Shares</div><div class="chart-wrap"><canvas id="c-share"></canvas></div></div></div>';
  const lbl=d.dailyStats.map(x=>x.date.slice(5));
  mkChart('c-cmt','bar',lbl,[br(d.dailyStats.map(x=>x.comments),'#8b5cf6')]);
  mkChart('c-pvp','bar',lbl,[br(d.dailyStats.map(x=>x.challengesSent),'#3b82f6','Sent'),br(d.dailyStats.map(x=>x.challengesAccepted),'#10b981','Accepted')],{plugins:{legend:{display:true,labels:{color:'#6b7280'}}}});
  mkChart('c-news','line',lbl,[ln(d.dailyStats.map(x=>x.newsViews),'#e8a020')]);
  mkChart('c-share','bar',lbl,[br(d.dailyStats.map(x=>x.newsShares),'#10b981')]);
}

async function renderErrors(d){
  const total=d.dailyErrors.reduce((s,x)=>s+x.errors,0);
  document.getElementById('content').innerHTML=
    '<div class="kpi-grid"><div class="kpi '+(total>0?'bad':'good')+'"><div class="kpi-label">Total Errors</div><div class="kpi-value">'+total+'</div></div></div>'+
    '<div class="chart-grid wide"><div class="chart-card"><div class="chart-title">Errors Per Day</div><div class="chart-wrap"><canvas id="c-err"></canvas></div></div></div>';
  mkChart('c-err','bar',d.dailyErrors.map(x=>x.date.slice(5)),[br(d.dailyErrors.map(x=>x.errors),'#ef4444')]);
}

async function renderRaw(d){
  const rows=(d.events||[]).filter(Boolean).map(e=>'<tr><td style="color:var(--muted);font-size:11px">'+new Date(e.timestamp).toLocaleTimeString()+'</td><td><span class="pill gold">'+(e.product||'-')+'</span></td><td>'+(e.feature||'-')+'</td><td>'+(e.action||'-')+'</td><td style="color:var(--muted);font-size:11px">'+JSON.stringify(e.props||{}).slice(0,80)+'</td></tr>').join('');
  document.getElementById('content').innerHTML=
    '<div class="table-card"><div class="table-header">Raw Events — '+d.date+' ('+d.count+' total)</div>'+
    '<table><thead><tr><th>Time</th><th>Product</th><th>Feature</th><th>Action</th><th>Props</th></tr></thead>'+
    '<tbody>'+(rows||'<tr><td colspan="5" style="color:var(--muted);text-align:center;padding:24px">No events yet</td></tr>')+'</tbody></table></div>';
}

const TITLES={overview:'Overview',gameplay:'Gameplay',retention:'Retention',social:'Social / PvP',errors:'Errors',raw:'Raw Events'};
async function load(){
  document.getElementById('status-bar').textContent='Loading...';
  document.getElementById('page-title').textContent=TITLES[S.view(S.view==='gameplay'?' — '+S.product:'');
  try{
    const data=await api(S.view);
    if(S.view==='overview')await renderOverview(data);
    else if(S.view==='gameplay')await renderGameplay(data);
    else if(S.view==='retention')await renderRetention(data);
    else if(S.view==='social')await renderSocial(data);
    else if(S.view==='errors')await renderErrors(data);
    else if(S.view==='raw')await renderRaw(data);
    document.getElementById('status-bar').textContent='Updated: '+new Date().toLocaleTimeString();
  }catch(e){
    document.getElementById('content').innerHTML='<div style="color:var(--red);padding:24px">Error: '+e.message+'</div>';
  }
}
</script>
</body>
</html>
