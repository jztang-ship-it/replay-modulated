<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- Drop user-scalable=no per a11y guideline (Lighthouse meta-viewport
         audit). Native double-tap-to-zoom remains useful for users with
         low vision; the in-game UI doesn't depend on the zoom lock. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <!-- Preconnect to Supabase: saves DNS + TLS round-trip on the first
         auth/REST/storage call. One project URL serves auth, REST, and
         storage (headshots, audio); a single preconnect covers all. -->
    <link rel="preconnect" href="https://hnhrpwwznzokkfagfumb.supabase.co" crossorigin>
    <title>Replay IFS — instant NBA fantasy</title>
    <meta name="description" content="Pull an NBA roster, see how the game actually went, beat the leaderboard. No waiting, no salary research. Just play." />

    <!-- Open Graph / Facebook / iMessage / Discord unfurl -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://replayifs.com/basketball/" />
    <meta property="og:site_name" content="Replay IFS" />
    <meta property="og:title" content="Replay IFS — instant NBA fantasy" />
    <meta property="og:description" content="Pull an NBA roster, see how the game actually went, beat the leaderboard. No waiting, no salary research. Just play." />
    <meta property="og:image" content="https://replayifs.com/og-basketball.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Replay IFS — instant NBA fantasy" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Replay IFS — instant NBA fantasy" />
    <meta name="twitter:description" content="Pull an NBA roster, see how the game actually went, beat the leaderboard. No waiting, no salary research. Just play." />
    <meta name="twitter:image" content="https://replayifs.com/og-basketball.png" />
    <meta name="twitter:image:alt" content="Replay IFS — instant NBA fantasy" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
