<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Replay IFS basketball beta: real players, real history, instant fantasy results." />
    <meta name="theme-color" content="#070a12" />
    <title>Replay IFS — Basketball Beta</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; color: #f4f7ff; background: radial-gradient(circle at 50% -10%, #243b63 0%, #101a2d 32%, #070a12 76%); }
      main { width: min(100%, 460px); text-align: center; }
      .wordmark { margin: 0 0 36px; font: 900 clamp(26px, 7vw, 36px)/1 Impact, "Arial Narrow", sans-serif; letter-spacing: .055em; }
      .accent { color: #ffb14a; }
      .eyebrow { margin: 0 0 14px; color: #ffcb8e; font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(36px, 10vw, 54px); line-height: .98; letter-spacing: -.055em; }
      p { color: #b7c4d9; line-height: 1.55; }
      .card { display: grid; gap: 6px; margin: 34px 0 20px; padding: 28px 20px; color: inherit; text-decoration: none; border: 1px solid rgba(255, 177, 74, .55); border-radius: 20px; background: linear-gradient(135deg, rgba(255, 145, 40, .2), rgba(255,255,255,.04)); box-shadow: 0 18px 55px rgba(0,0,0,.3); transition: transform .15s ease, border-color .15s ease; }
      .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: #ffcb8e; outline: none; }
      .ball { font-size: 42px; }
      .sport { font: 900 28px/1 Impact, "Arial Narrow", sans-serif; letter-spacing: .04em; text-transform: uppercase; }
      .league { color: #ffcb8e; font-size: 12px; font-weight: 800; letter-spacing: .16em; }
      .cta { margin-top: 8px; color: #070a12; background: #ffb14a; border-radius: 999px; padding: 12px 18px; font-size: 14px; font-weight: 900; }
      .note { margin: 0 auto; max-width: 320px; font-size: 12px; }
      .signin { display: inline-block; margin-top: 22px; color: #d8e2f3; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <div class="wordmark">REPLAY <span class="accent">IFS</span></div>
      <p class="eyebrow">Controlled beta · Free to play</p>
      <h1>Basketball.<br />Instantly.</h1>
      <p>Build a five-player lineup from real NBA history, then see how it performed—right away.</p>
      <a class="card" href="/basketball/?play=1" id="play-basketball" aria-label="Play basketball">
        <span class="ball" aria-hidden="true">🏀</span>
        <span class="sport">Basketball</span>
        <span class="league">NBA</span>
        <span class="cta">Play the beta</span>
      </a>
      <p class="note">Real stats · Fantasy only · No wagering</p>
      <a class="signin" href="/basketball/?signin=1">Already have an account? Sign in</a>
    </main>
    <script>
      (function () {
        var play = document.getElementById('play-basketball');
        if (play) {
          play.addEventListener('click', function () {
            try { localStorage.setItem('replay_last_sport', 'basketball'); } catch (_) {}
          });
        }
        try {
          fetch('/api/analytics', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ events: [{
              userId: (function () { try { return localStorage.getItem('rm_uid') || ''; } catch (_) { return ''; } })(),
              sessionId: (function () { try { return localStorage.getItem('rm_sid') || ''; } catch (_) { return ''; } })(),
              product: 'basketball', feature: 'onboarding', action: 'landing_view',
              props: { sport: 'basketball' }, timestamp: Date.now(), platform: 'web', appVersion: '1.0.0'
            }] }),
            keepalive: true
          });
        } catch (_) {}
      })();
    </script>
  </body>
</html>
